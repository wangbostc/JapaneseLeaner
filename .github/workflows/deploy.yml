name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # install runs the postinstall that copies the kuromoji dictionary into public/dict
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Set the repository variable KIKITORI_URL to the Worker address after moving; the old
          # site then tells visitors to export a backup and open the new one.
          VITE_MOVED_TO: ${{ vars.KIKITORI_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
