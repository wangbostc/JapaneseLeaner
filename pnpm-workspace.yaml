# Install scripts pnpm asks about. The app runs Whisper in the browser (onnxruntime-web),
# so the native Node runtime and protobufjs's postinstall aren't needed. esbuild and workerd
# are wrangler's bundler and local Workers runtime; their scripts verify platform binaries.
allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  workerd: true
